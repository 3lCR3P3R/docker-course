services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Copie .env.example a .env}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    networks: [interna]
  api:
    image: api-app:1.0.0
    build: .
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:?Defina DB_NAME}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    networks: [interna]
  proxy:
    image: nginx:1.30-alpine
    ports:
      - "${PROXY_HOST:-127.0.0.1}:${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped
    networks: [entrada, interna]
volumes:
  pgdata:
networks:
  entrada:
    driver: bridge
  interna:
    driver: bridge
    internal: true
